schema_version: 1
experiment_id: ccwm-real-franka-dinowm-v3-pool192-actionaligned
claim_scope: One-step weighted conformal coverage for a fixed pretrained world model under controlled
  covariate shifts over an external finite pool of real Franka robot transitions. Every outcome is observed;
  no state, action, image, target, or score is generated synthetically.
execution:
  require_linux: true
  require_nvidia_gpu: true
  require_python: '3.10'
  deterministic_torch: true
  overwrite_outputs: false
source_model:
  name: dino_wm_droid
  repository_key: jepa_wms
  config_path: configs/evals/simu_env_planning/droid/dino-wm/droid_L2_cem_sourcedset_H3_nas3_maxnorm01_ctxt2_gH3_r224_alpha0_ep64_decode.yaml
  checkpoint_filename: dino_wm_droid.pth.tar
  device: cuda:0
  score: latent_root_mean_squared_error
  batch_size: 8
  disable_decoder_heads: true
dataset:
  asset_key: jepa_wms_dataset
  local_subdir: franka_custom
  camera_key: episode_data/observation/exterior_image_2_left
  cartesian_key: episode_data/observation/cartesian_position
  gripper_key: episode_data/observation/gripper_position
  source_fps: 30
  evaluation_fps: 4
  context_frames: 2
  horizon: 1
  action_alignment: consecutive_pose_differences_for_each_context_frame
  max_windows_per_episode: 64
  min_episodes: 8
  min_pool_size: 192
  allowed_episode_globs:
  - '**/pick/liftcup_v0/run_0001/episode.h5'
  - '**/pick/pickandplaceredcube_v0/run_0001/episode.h5'
  - '**/pick/pickcube_v0/run_0001/episode.h5'
  - '**/pick/pickpen_v0/run_0001/episode.h5'
  - '**/pick/pickupcup_v0/run_0001/episode.h5'
  - '**/pick/reachcup_v0/run_0001/episode.h5'
  - '**/pick/reachliftcup_v0/run_0001/episode.h5'
  - '**/pick/reachliftcup_v1/run_0001/episode.h5'
  - '**/push/brownboxpush_v0/run_0001/episode.h5'
  - '**/push/push_various_objects/blue_bowl/episode.h5'
  - '**/push/push_various_objects/blue_box/episode.h5'
  - '**/push/push_various_objects/cap/episode.h5'
  - '**/push/push_various_objects/pengiun_plush/episode.h5'
  - '**/folding/foldjacketsleeve_v0/run_0001/episode.h5'
  - '**/folding/foldjacketsleeve_v1/run_0001/episode.h5'
shift_design:
  base_law: uniform_over_indexed_real_transitions
  statistic: empirical_midrank_of_translation_action_norm
  statistic_range:
  - -1.0
  - 1.0
  source_mass: P_lambda(i) proportional to exp(-lambda * g_i)
  target_mass: Q_lambda(i) proportional to exp(+lambda * g_i)
  lambdas:
  - 0.0
  - 0.5
  - 1.0
  - 1.5
  support: common_finite_support
  outcome_blind: true
ratio_estimation:
  domain_prior_rho: 0.5
  posterior_clip_gamma: 0.05
  feature_vector:
  - shift_statistic
  classifier: deterministic_ridge_logistic_regression
  source_domain_samples: 4000
  target_domain_samples: 4000
  ridge: 1.0e-06
  optimizer: scipy_lbfgsb
  max_iterations: 500
  tolerance: 1.0e-10
conformal:
  alphas:
  - 0.05
  - 0.1
  - 0.2
  calibration_size: 500
  target_test_size: 10000
  repetitions: 50
  seed_base: 271828
  methods:
  - unweighted
  - oracle_ratio
  - estimated_ratio
  - estimated_ratio_clipped
  estimated_ratio_cap: 5.0
  weighted_quantile: test_dependent_plus_infinity_atom
statistics:
  confidence_level: 0.95
  repeated_run_interval: student_t
  per_run_binomial_interval: wilson
  simultaneous_interval: bonferroni_student_t
  cluster_unit: episode
  cluster_bootstrap_repetitions: 2000
  cluster_bootstrap_seed: 314159
  report_exact_finite_pool_tv: true
  report_exact_finite_pool_l1: true
  report_exact_population_logistic_regret: true
  report_effective_sample_size: true
  report_infinite_radius_rate: true
hard_gates:
  reject_synthetic_data_generators: true
  reject_outcome_dependent_shift: true
  reject_unpinned_git_repositories: true
  reject_missing_cells: true
  reject_nan_or_inf_except_conformal_radius: true
  reject_oracle_gross_undercoverage_tolerance: 0.01
  reject_theorem_violation_tolerance: 0.01
  reject_lean_sorry_admit_axiom: true
